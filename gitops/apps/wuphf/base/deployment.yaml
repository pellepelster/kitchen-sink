apiVersion: apps/v1
kind: Deployment
metadata:
  name: wuphf
  labels:
    app.kubernetes.io/name: wuphf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wuphf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wuphf
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: wuphf
          image: ghcr.io/pellepelster/java-spring-wuphf:1.0.0
          ports:
            - name: http
              containerPort: 8080
          # image has no actuator, "/" answers 200 once Tomcat is up
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # buildpack memory calculator sizes the JVM from this limit
              memory: 1Gi
