apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: wuphf
      spec:
        template:
          spec:
            containers:
              - name: wuphf
                env:
                  - name: CLUSTER_NAME
                    value: cluster-1
                  - name: YOLO
                    value: "2000"
