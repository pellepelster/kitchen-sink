# one wuphf Application per cluster registered via register-cluster.sh
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: wuphf
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # an empty selector also matches the built-in in-cluster, selecting on the
    # secret label restricts it to clusters registered via register-cluster.sh
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'wuphf-{{.name}}'
    spec:
      project: default
      source:
        # TODO: point at the remote this repo is pushed to
        repoURL: https://github.com/pellepelster/kitchen-sink.git
        targetRevision: HEAD
        # each cluster needs a matching overlay
        path: 'gitops/apps/wuphf/overlays/{{.name}}'
      destination:
        name: '{{.name}}'
        namespace: wuphf
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
